<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>

    <!-- Hintergrund-Verlauf -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1c3050"/>
      <stop offset="100%" stop-color="#0c1828"/>
    </linearGradient>

    <!-- Fräser-Körper (Chrom-Effekt) -->
    <linearGradient id="millGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6677aa"/>
      <stop offset="20%"  stop-color="#b0c4de"/>
      <stop offset="50%"  stop-color="#e8f2ff"/>
      <stop offset="80%"  stop-color="#b0c4de"/>
      <stop offset="100%" stop-color="#5566aa"/>
    </linearGradient>

    <!-- Spindel-Halter -->
    <linearGradient id="holderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4455880"/>
      <stop offset="30%"  stop-color="#99aac0"/>
      <stop offset="65%"  stop-color="#c8d8e8"/>
      <stop offset="100%" stop-color="#445588"/>
    </linearGradient>

    <!-- Schneidspitze (Gold) -->
    <linearGradient id="tipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d4aa33"/>
      <stop offset="100%" stop-color="#886600"/>
    </linearGradient>

    <!-- Werkstück -->
    <linearGradient id="wpGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3d6080"/>
      <stop offset="100%" stop-color="#1e3048"/>
    </linearGradient>

    <!-- Leuchten für Funken -->
    <filter id="spark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

  </defs>

  <!-- ── Hintergrund ── -->
  <rect width="256" height="256" rx="46" fill="url(#bgGrad)"/>
  <!-- Dezente Randlinie -->
  <rect x="2" y="2" width="252" height="252" rx="44"
        fill="none" stroke="#2a4a6a" stroke-width="2"/>

  <!-- ── Koordinatenkreuz (unten links) ── -->
  <!-- X-Achse -->
  <line x1="26" y1="198" x2="74" y2="198"
        stroke="#cc4433" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="76,198 68,193 68,203" fill="#cc4433"/>
  <text x="80" y="203" font-family="Arial,sans-serif" font-size="16"
        font-weight="bold" fill="#cc4433" opacity="0.85">X</text>

  <!-- Y-Achse -->
  <line x1="26" y1="198" x2="26" y2="150"
        stroke="#33aa55" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="26,148 21,156 31,156" fill="#33aa55"/>
  <text x="14" y="145" font-family="Arial,sans-serif" font-size="16"
        font-weight="bold" fill="#33aa55" opacity="0.85">Y</text>

  <!-- ── Werkstück ── -->
  <rect x="26" y="188" width="204" height="46" rx="5" fill="url(#wpGrad)"/>
  <!-- Oberfläche hell -->
  <rect x="26" y="188" width="204" height="7" rx="5" fill="#4a7090" opacity="0.9"/>
  <!-- Gefräste Rillen (Draufsicht) -->
  <line x1="72"  y1="195" x2="72"  y2="234" stroke="#1e3048" stroke-width="1.2" opacity="0.55"/>
  <line x1="114" y1="195" x2="114" y2="234" stroke="#1e3048" stroke-width="1.2" opacity="0.55"/>
  <line x1="156" y1="195" x2="156" y2="234" stroke="#1e3048" stroke-width="1.2" opacity="0.55"/>
  <line x1="198" y1="195" x2="198" y2="234" stroke="#1e3048" stroke-width="1.2" opacity="0.55"/>

  <!-- ── Fräsbahn (G-Code Pfad) auf Werkstück ── -->
  <!-- Erste Linie (G01, rot) -->
  <polyline points="44,192  112,192  112,192  180,192"
            stroke="#ee4422" stroke-width="3.5" fill="none"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Eilgang zurück (G00, gestrichelt) -->
  <line x1="180" y1="192" x2="44" y2="192"
        stroke="#88aacc" stroke-width="2" stroke-dasharray="7,5" opacity="0.45"/>
  <!-- Richtungspfeil auf Fräsbahn -->
  <polygon points="130,192 120,188 120,196" fill="#ee4422" opacity="0.85"/>

  <!-- ── Fräser-Aufnahme / Spindel ── -->
  <!-- Flansch oben -->
  <rect x="96" y="14" width="64" height="38" rx="9" fill="#7788bb"/>
  <rect x="96" y="18" width="64" height="5"  rx="3" fill="#aabbd0" opacity="0.6"/>
  <rect x="96" y="28" width="64" height="3"  fill="#aabbd0" opacity="0.45"/>
  <rect x="96" y="36" width="64" height="3"  fill="#aabbd0" opacity="0.45"/>

  <!-- Spannzange (Taper) -->
  <path d="M104,52 L96,52 L110,72 L146,72 L160,52 L152,52 Z"
        fill="#8899cc"/>
  <line x1="104" y1="52" x2="152" y2="52"
        stroke="#c0d4ec" stroke-width="2" opacity="0.65"/>

  <!-- ── Schaft (Zylinder) ── -->
  <rect x="110" y="72" width="36" height="96" fill="url(#millGrad)"/>

  <!-- Rillen / Schneidkanten (Helixlinien) -->
  <path d="M115,72 Q110,92 115,112 Q110,132 115,152 Q110,165 114,168"
        stroke="#4a5a7a" stroke-width="2" fill="none" opacity="0.75"/>
  <path d="M141,72 Q146,92 141,112 Q146,132 141,152 Q146,165 142,168"
        stroke="#4a5a7a" stroke-width="2" fill="none" opacity="0.75"/>
  <!-- Mittelrille -->
  <path d="M128,72 Q124,92 128,112 Q124,132 128,168"
        stroke="#7a8aaa" stroke-width="1" fill="none" opacity="0.35"/>

  <!-- Seitliche Glanzlinie -->
  <rect x="122" y="74" width="5" height="90" rx="2"
        fill="white" opacity="0.18"/>

  <!-- ── Schneidspitze ── -->
  <path d="M110,168 L128,190 L146,168 Z" fill="url(#tipGrad)"/>
  <!-- Glanzlinie Spitze -->
  <line x1="119" y1="168" x2="128" y2="182"
        stroke="#f0cc55" stroke-width="1.5" opacity="0.55" stroke-linecap="round"/>

  <!-- ── Span / Funken ── -->
  <!-- Span-Linie -->
  <path d="M128,190 Q148,182 158,170 Q164,160 160,150"
        stroke="#ffaa22" stroke-width="3" fill="none"
        stroke-linecap="round" filter="url(#spark)" opacity="0.85"/>

  <!-- Funken -->
  <circle cx="162" cy="168" r="4.5" fill="#ffdd44" filter="url(#spark)" opacity="0.95"/>
  <circle cx="170" cy="158" r="3"   fill="#ffcc33" filter="url(#spark)" opacity="0.80"/>
  <circle cx="158" cy="155" r="2.5" fill="#ffee66" opacity="0.75"/>
  <circle cx="165" cy="176" r="2"   fill="#ffcc22" opacity="0.65"/>
  <circle cx="173" cy="164" r="1.8" fill="#ffbb33" opacity="0.55"/>
  <circle cx="156" cy="148" r="1.5" fill="#ffee44" opacity="0.50"/>

  <!-- ── G-Code Beschriftung (Ecke) ── -->
  <text x="176" y="44" font-family="Consolas,'Courier New',monospace"
        font-size="22" font-weight="bold" fill="#4a90d9" opacity="0.75">G</text>
  <text x="198" y="44" font-family="Consolas,'Courier New',monospace"
        font-size="14" fill="#55aacc" opacity="0.60">01</text>
  <text x="176" y="62" font-family="Consolas,'Courier New',monospace"
        font-size="11" fill="#3a7a99" opacity="0.50">X128</text>

</svg>
